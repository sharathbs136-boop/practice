trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  imageTag: $(Build.BuildId)
  acrLoginServer: $(ACR_LOGIN_SERVER)

stages:
  - stage: Build
    displayName: Build and push images
    jobs:
      - job: BuildImages
        steps:
          - task: SonarQubePrepare@7
            displayName: Prepare SonarQube analysis
            inputs:
              SonarQube: $(SONARQUBE_SERVICE_CONNECTION)
              scannerMode: cli
              configMode: manual
              cliProjectKey: microshop
              cliProjectName: Microshop
              cliSources: services,frontend
          - script: python -m unittest discover -s tests -v
            displayName: Run API tests
          - task: SonarQubeAnalyze@7
            displayName: Run SonarQube analysis
          - task: SonarQubePublish@7
            displayName: Publish SonarQube quality gate
            inputs:
              pollingTimeoutSec: 300
          - task: Docker@2
            displayName: Build and push inventory image
            inputs:
              command: buildAndPush
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              repository: inventory
              Dockerfile: services/inventory/Dockerfile
              tags: $(imageTag)
          - task: Docker@2
            displayName: Build and push orders image
            inputs:
              command: buildAndPush
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              repository: orders
              Dockerfile: services/orders/Dockerfile
              tags: $(imageTag)
          - task: Docker@2
            displayName: Build and push products image
            inputs:
              command: buildAndPush
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              repository: products
              Dockerfile: services/products/Dockerfile
              tags: $(imageTag)
          - task: Docker@2
            displayName: Build and push frontend image
            inputs:
              command: buildAndPush
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              repository: frontend
              Dockerfile: frontend/Dockerfile
              tags: $(imageTag)
          - task: Docker@2
            displayName: Build and push payments image
            inputs:
              command: buildAndPush
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              repository: payments
              Dockerfile: services/payments/Dockerfile
              tags: $(imageTag)
          - bash: |
              set -euo pipefail
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
              for image in inventory orders products frontend payments; do
                trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$(acrLoginServer)/$image:$(imageTag)"
              done
            displayName: Scan images with Trivy

  - stage: Dev
    displayName: Deploy to development
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployDev
        environment: microshop-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials --resource-group $(AKS_RESOURCE_GROUP) --name $(AKS_NAME) --overwrite-existing
                      sed -i "s|\${ACR_LOGIN_SERVER}|$(acrLoginServer)|g; s|\${IMAGE_TAG}|$(imageTag)|g" deploy/k8s/*.yaml
                      find deploy/k8s -type f ! -name 'secrets.example.yaml' -print0 | xargs -0 kubectl apply -n microshop -f
                      kubectl rollout status deployment/frontend -n microshop --timeout=120s

  - stage: QA
    displayName: Deploy to QA
    dependsOn: Dev
    condition: succeeded()
    jobs:
      - deployment: DeployQA
        environment: microshop-qa
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials --resource-group $(AKS_RESOURCE_GROUP) --name $(AKS_NAME) --overwrite-existing
                      sed -i "s|\${ACR_LOGIN_SERVER}|$(acrLoginServer)|g; s|\${IMAGE_TAG}|$(imageTag)|g" deploy/k8s/*.yaml
                      find deploy/k8s -type f ! -name 'secrets.example.yaml' -print0 | xargs -0 kubectl apply -n microshop -f
                      kubectl rollout status deployment/frontend -n microshop --timeout=120s

  - stage: UAT
    displayName: Deploy to UAT
    dependsOn: QA
    condition: succeeded()
    jobs:
      - deployment: DeployUAT
        environment: microshop-uat
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials --resource-group $(AKS_RESOURCE_GROUP) --name $(AKS_NAME) --overwrite-existing
                      sed -i "s|\${ACR_LOGIN_SERVER}|$(acrLoginServer)|g; s|\${IMAGE_TAG}|$(imageTag)|g" deploy/k8s/*.yaml
                      find deploy/k8s -type f ! -name 'secrets.example.yaml' -print0 | xargs -0 kubectl apply -n microshop -f
                      kubectl rollout status deployment/frontend -n microshop --timeout=120s

  - stage: Prod
    displayName: Deploy to production
    dependsOn: UAT
    condition: succeeded()
    jobs:
      - deployment: DeployProd
        environment: microshop-prod
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials --resource-group $(AKS_RESOURCE_GROUP) --name $(AKS_NAME) --overwrite-existing
                      sed -i "s|\${ACR_LOGIN_SERVER}|$(acrLoginServer)|g; s|\${IMAGE_TAG}|$(imageTag)|g" deploy/k8s/*.yaml
                      find deploy/k8s -type f ! -name 'secrets.example.yaml' -print0 | xargs -0 kubectl apply -n microshop -f
                      kubectl rollout status deployment/frontend -n microshop --timeout=120s
