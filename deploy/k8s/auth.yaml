apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: microshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: ${ACR_LOGIN_SERVER}/auth:${IMAGE_TAG}
          env:
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: microshop-secrets
                  key: auth-secret
          ports:
            - containerPort: 8003
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: microshop
spec:
  selector:
    app: auth
  ports:
    - port: 8003
      targetPort: 8003
