apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: microshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: ${ACR_LOGIN_SERVER}/orders:${IMAGE_TAG}
          env:
            - name: INVENTORY_URL
              value: http://inventory:8001
            - name: PAYMENT_URL
              value: http://payments:8004
            - name: DB_PATH
              value: /data/orders.db
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: microshop-secrets
                  key: auth-secret
          volumeMounts:
            - name: orders-data
              mountPath: /data
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
      volumes:
        - name: orders-data
          persistentVolumeClaim:
            claimName: orders-data
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: microshop
spec:
  type: LoadBalancer
  selector:
    app: orders
  ports:
    - port: 80
      targetPort: 8000
