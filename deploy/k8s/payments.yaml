apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: microshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: ${ACR_LOGIN_SERVER}/payments:${IMAGE_TAG}
          ports:
            - containerPort: 8004
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: microshop
spec:
  selector:
    app: payments
  ports:
    - port: 8004
      targetPort: 8004
